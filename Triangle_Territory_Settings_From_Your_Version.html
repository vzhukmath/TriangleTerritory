(c=>adjacent(c.id,t))}function nextTeam(from){for(let k=1;k<=3;k++){let t=(from+k)%3;if(possible(t).length)return t}return -1}function snapshot(){history.push({owners:[...owners],turn,remaining,die,logs:[...logs],names:[...names]})}function counts(){return [0,1,2].map(t=>owners.filter(v=>v===t).length)}function advance(){remaining=0;die=null;turn=nextTeam(turn)}function chooseTeam(t){if(turn===t)return;snapshot();turn=t;remaining=0;die=null;logs.unshift(`${tr('assigned')}: ${names[t]}`);render()}function roll(){if(mode!=='dice'||turn<0||die!==null)return;if(!possible(turn).length){advance();render();return}snapshot();die=Math.floor(Math.random()*Number($('diceRange').value))+1;remaining=die;logs.unshift(`${names[turn]}: ${tr('rolled')} ${die}`);render()}function play(i){if(turn<0||(mode==='dice'&&remaining<=0)||!adjacent(i,turn))return;snapshot();owners[i]=turn;if(mode==='dice')remaining--;logs.unshift(`${names[turn]} ${tr('captured')} ${i+1}`);if((mode==='dice'&&remaining===0)||!possible(turn).length)advance();render()}function finish(skip){if(turn<0)return;snapshot();logs.unshift(`${names[turn]} ${tr(skip?'skipped':'finished')}`);advance();render()}function setTexts(){document.documentElement.lang=lang;for(let [id,k] of Object.entries({subtitle:'subtitle',languageLabel:'language',restart:'restart',freeLabel:'free',availableLabel:'available',hostLabel:'host',diceTitle:'dice',diceInfo:'diceInfo',diceRangeLabel:'diceRangeLabel',finish:'finish',pass:'pass',undo:'undo',rulesTitle:'rules',rules1:'rules1',rules2:'rules2',modeLabel:'modeLabel',modeDice:'modeDice',modeFree:'modeFree',scoreModeLabel:'scoreModeLabel',scoreCount:'scoreCount',scoreWeight:'scoreWeight'}))$(id).textContent=tr(k);$('settingsOpen').textContent='⚙ '+({en:'Settings',ru:'Настройки',kk:'Баптаулар'}[lang]);$('settingsTitle').textContent='⚙ '+({en:'Game settings',ru:'Настройки игры',kk:'Ойын баптаулары'}[lang]);$('settingsClose').textContent=({en:'Done',ru:'Готово',kk:'Дайын'}[lang]);$('rollTop').textContent=tr('roll')}function render(){setTexts();const availableSet=new Set(turn>=0&&(mode==='free'||remaining>0)?possible(turn).map(c=>c.id):[]);$('board').innerHTML='';for(const c of cells){let g=document.createElementNS('http://www.w3.org/2000/svg','g'),polygon=document.createElementNS(g.namespaceURI,'polygon');polygon.setAttribute('points',c.vertices.map(v=>v.join(',')).join(' '));polygon.setAttribute('fill',availableSet.has(c.id)&&owners[c.id]===-1?'#dcfce7':owners[c.id]===-1?'#fff':colors[owners[c.id]]);polygon.setAttribute('class','cell '+(availableSet.has(c.id)?'available':'')+(owners[c.id]!==-1&&!availableSet.has(c.id)?' locked':''));polygon.addEventListener('click',()=>play(c.id));let label=document.createElementNS(g.namespaceURI,'text');label.setAttribute('x',c.vertices.reduce((a,v)=>a+v[0],0)/3);label.setAttribute('y',c.vertices.reduce((a,v)=>a+v[1],0)/3+1);label.setAttribute('class','number '+(owners[c.id]!==-1?'ownedNumber':''));label.textContent=c.id+1;let wt=document.createElementNS(g.namespaceURI,'text');wt.setAttribute('x',c.vertices.reduce((a,v)=>a+v[0],0)/3+14);wt.setAttribute('y',c.vertices.reduce((a,v)=>a+v[1],0)/3+9);wt.setAttribute('class','weightNumber '+(owners[c.id]!==-1?'ownedWeight':''));wt.textContent=weights[c.id];wt.style.display=scoreMode==='count'?'none':'';g.append(polygon,label,wt);$('board').append(g)}let sc=counts(),ws=[0,1,2].map(t=>owners.reduce((a,o,j)=>a+(o===t?weights[j]:0),0)),scores=scoreMode==='count'?sc:ws;$('teams').innerHTML=names.map((name,i)=>`<div class="team ${turn===i?'active':''}" style="--team:${colors[i]}" role="button" tabindex="0" data-team="${i}"><span class="dot"></span><div class="name"><input data-name="${i}" maxlength="36" aria-label="${tr('newName')} ${i+1}" value="${escapeHtml(name)}"><small>${turn===i?tr('current'):tr('territories')}</small></div><div class="score">${scores[i]}<small>${tr('points')}: ${scores[i]}</small><small>${tr('territories')}: ${sc[i]}</small><small>${tr('weight')}: ${ws[i]}</small></div></div>`).join('');$('teams').querySelectorAll('[data-team]').forEach(el=>{let t=Number(el.dataset.team);el.addEventListener('click',e=>{if(e.target.tagName!=='INPUT')chooseTeam(t)});el.addEventListener('keydown',e=>{if(e.target.tagName!=='INPUT'&&(e.key==='Enter'||e.key===' ')){e.preventDefault();chooseTeam(t)}})});$('teams').querySelectorAll('[data-name]').forEach(el=>{el.addEventListener('click',e=>e.stopPropagation());el.addEventListener('change',()=>{let i=Number(el.dataset.name),value=el.value.trim()||`${tr('team')} ${'ABC'[i]}`;names[i]=value;render()})});if(turn===-1){let max=Math.max(...scores),winners=names.filter((_,i)=>scores[i]===max);$('turn').innerHTML=`<strong>${tr('ended')}</strong><div class="hint">${winners.length===1?tr('winner')+': ':tr('tie')+': '}${escapeHtml(winners.join(', '))} · ${max}</div>`}else{$('turn').innerHTML=`<strong style="color:${colors[turn]}">● ${tr('turn')}: ${escapeHtml(names[turn])}</strong><div class="hint">${mode==='free'?tr('freeInfo'):die===null?tr('rollFirst'):`${tr('rolledStatus')}: ${die} · ${tr('remaining')}: ${remaining}`}<div>${tr('availableCount')}: ${possible(turn).length}</div></div>`}$('boardToolbar').hidden=mode!=='dice';$('dicePanel').hidden=mode!=='dice';$('rollTopStatus').textContent=die===null?tr('rollFirst'):`${tr('rolledStatus')}: ${die} · ${tr('remaining')}: ${remaining}`;$('mode').value=mode;$('scoreMode').value=scoreMode;$('freeInfo').hidden=mode!=='free';$('freeInfo').textContent=tr('freeInfo');$('die').textContent=die??'?';$('remaining').innerHTML=die===null?tr('rollFirst'):`<span class="pill">${tr('remaining')}: ${remaining} / ${die}</span>`;$('rollTop').disabled=turn<0||die!==null;$('finish').disabled=turn<0||(mode==='dice'&&die===null);$('pass').disabled=turn<0;$('undo').disabled=!history.length;$('log').innerHTML=logs.slice(0,10).map(s=>`<div>• ${escapeHtml(s)}</div>`).join('')}function reset(){owners=Array(36).fill(-1);owners[0]=1;owners[25]=0;owners[35]=2;turn=0;remaining=0;die=null;history=[];logs=[tr('start')];render()}$('scoreMode').addEventListener('change',e=>{scoreMode=e.target.value;render()});$('diceRange').addEventListener('change',()=>{if(die!==null){snapshot();die=null;remaining=0;}render()});$('mode').addEventListener('change',e=>{snapshot();mode=e.target.value;remaining=0;die=null;render()});$('lang').addEventListener('change',e=>{lang=e.target.value;render()});$('restart').addEventListener('click',()=>{if(history.length&&!confirm(tr('confirm')))return;reset()});$('undo').addEventListener('click',()=>{let s=history.pop();if(!s)return;({owners,turn,remaining,die,logs,names}=s);render()});$('pass').addEventListener('click',()=>finish(true));$('finish').addEventListener('click',()=>finish(false));$('rollTop').addEventListener('click',roll);$('settingsOpen').addEventListener('click',()=>{$('settingsOverlay').hidden=false});$('settingsClose').addEventListener('click',()=>{$('settingsOverlay').hidden=true});$('settingsOverlay').addEventListener('click',e=>{if(e.target===$('settingsOverlay'))$('settingsOverlay').hidden=true});document.addEventListener('keydown',e=>{if(e.key==='Escape')$('settingsOverlay').hidden=true});$('lang').value=lang;makeCells();reset()})();
